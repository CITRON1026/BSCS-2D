{% extends 'base.html' %}

{% block title %}Login - Library System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card" style="margin-top: 50px;">
            <div class="card-body p-5">
                <h2 class="card-title text-center mb-4">📚 Login</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3">Don't have an account? <a href="/register">Register here</a></p>
                <div id="message" class="alert d-none"></div>
            </div>
        </div>
    </div>
</div>

<script>
$(document).ready(function() {
    $('#loginForm').on('submit', function(e) {
        e.preventDefault();
        $.ajax({
            url: '/login',
            type: 'POST',
            data: JSON.stringify({
                email: $('#email').val(),
                password: $('#password').val()
            }),
            contentType: 'application/json',
            success: function(data) {
                window.location.href = '/dashboard';
            },
            error: function(xhr) {
                $('#message').removeClass('d-none alert-success').addClass('alert-danger').text(xhr.responseJSON.message);
            }
        });
    });
});
</script>
{% endblock %}
